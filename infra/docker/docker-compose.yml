version: '3.9'

# ========================
# Quorvexa Local Development Stack
# Run: make docker:up
# ========================

networks:
  quorvexa-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  kafka-data:
  zookeeper-data:

services:

  # ────────────────────────────
  # PostgreSQL — primary database
  # ────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: quorvexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quorvexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quorvexa_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-quorvexa_db}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quorvexa} -d ${POSTGRES_DB:-quorvexa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quorvexa-net

  # ────────────────────────────
  # Redis — cache, sessions, pub/sub
  # ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: quorvexa-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
      --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quorvexa-net

  # ────────────────────────────
  # Qdrant — vector database for AI memory
  # ────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: quorvexa-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - quorvexa-net

  # ────────────────────────────
  # Zookeeper — required for Kafka
  # ────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: quorvexa-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - quorvexa-net

  # ────────────────────────────
  # Kafka — event streaming
  # ────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: quorvexa-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - quorvexa-net

  # ────────────────────────────
  # RabbitMQ — alternative message broker
  # ────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: quorvexa-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-quorvexa}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-quorvexa_pass}
      RABBITMQ_DEFAULT_VHOST: quorvexa
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - quorvexa-net

  # ────────────────────────────
  # Ollama — local LLM serving
  # Start after: make docker:up
  # Then: docker exec quorvexa-ollama ollama pull llama3
  # ────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: quorvexa-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - quorvexa-net
    profiles:
      - llm

  # ────────────────────────────
  # Auth Service
  # ────────────────────────────
  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    container_name: quorvexa-auth
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-quorvexa}:${POSTGRES_PASSWORD:-quorvexa_dev_pass}@postgres:5432/${POSTGRES_DB:-quorvexa_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - quorvexa-net
    profiles:
      - services

  # ────────────────────────────
  # User Service
  # ────────────────────────────
  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    container_name: quorvexa-user
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-quorvexa}:${POSTGRES_PASSWORD:-quorvexa_dev_pass}@postgres:5432/${POSTGRES_DB:-quorvexa_db}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quorvexa-net
    profiles:
      - services

  # ────────────────────────────
  # Notification Service
  # ────────────────────────────
  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    container_name: quorvexa-notification
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-quorvexa}:${POSTGRES_PASSWORD:-quorvexa_dev_pass}@postgres:5432/${POSTGRES_DB:-quorvexa_db}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quorvexa-net
    profiles:
      - services

  # ────────────────────────────
  # Workflow Service
  # ────────────────────────────
  workflow-service:
    build:
      context: ../..
      dockerfile: services/workflow-service/Dockerfile
    container_name: quorvexa-workflow
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-quorvexa}:${POSTGRES_PASSWORD:-quorvexa_dev_pass}@postgres:5432/${POSTGRES_DB:-quorvexa_db}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKER: kafka:29092
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - quorvexa-net
    profiles:
      - services

  # ────────────────────────────
  # AI Agent Service
  # ────────────────────────────
  ai-agent-service:
    build:
      context: ../../services/ai-agent-service
      dockerfile: Dockerfile
    container_name: quorvexa-ai-agent
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      ENVIRONMENT: development
      PORT: 3005
      LLM_PROVIDER: local
      OPENAI_BASE_URL: http://ollama:11434/v1
      VECTOR_DB_URL: http://qdrant:6333
      REDIS_HOST: redis
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quorvexa-net
    profiles:
      - services

  # ────────────────────────────
  # API Gateway
  # ────────────────────────────
  gateway:
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    container_name: quorvexa-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      WORKFLOW_SERVICE_URL: http://workflow-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      AI_AGENT_SERVICE_URL: http://ai-agent-service:3005
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - auth-service
      - user-service
      - workflow-service
      - notification-service
      - ai-agent-service
    networks:
      - quorvexa-net
    profiles:
      - services

  # ────────────────────────────
  # Web Frontend
  # ────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: quorvexa-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - gateway
    networks:
      - quorvexa-net
    profiles:
      - services

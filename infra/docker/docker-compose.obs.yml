# ========================
# Quorvexa Observability Stack
# Prometheus + Grafana + ELK + Jaeger
# Run: make dev:obs
# ========================

networks:
  quorvexa-net:
    external: true

volumes:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  jaeger-data:

services:

  # ────────────────────────────
  # Prometheus — metrics scraping
  # UI: http://localhost:9090
  # ────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: quorvexa-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - quorvexa-net

  # ────────────────────────────
  # Grafana — visualization dashboards
  # UI: http://localhost:3001 (admin/admin)
  # ────────────────────────────
  grafana:
    image: grafana/grafana-oss:11.3.3
    container_name: quorvexa-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - quorvexa-net

  # ────────────────────────────
  # Elasticsearch — log storage
  # ────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.0
    container_name: quorvexa-elasticsearch
    restart: unless-stopped
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - quorvexa-net

  # ────────────────────────────
  # Kibana — log exploration UI
  # UI: http://localhost:5601
  # ────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.16.0
    container_name: quorvexa-kibana
    restart: unless-stopped
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - quorvexa-net

  # ────────────────────────────
  # Logstash — log ingestion pipeline
  # ────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.16.0
    container_name: quorvexa-logstash
    restart: unless-stopped
    ports:
      - "${LOGSTASH_PORT:-5044}:5044"
      - "${LOGSTASH_API_PORT:-9600}:9600"
    volumes:
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - quorvexa-net

  # ────────────────────────────
  # Jaeger — distributed tracing
  # UI: http://localhost:16686
  # ────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: quorvexa-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    volumes:
      - jaeger-data:/tmp
    networks:
      - quorvexa-net

  # ────────────────────────────
  # OpenTelemetry Collector — telemetry aggregation
  # ────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: quorvexa-otel
    restart: unless-stopped
    ports:
      - "${OTEL_COLLECTOR_PORT:-55680}:55680"
      - "${OTEL_COLLECTOR_METRICS_PORT:-8889}:8889"
    volumes:
      - ./config/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - jaeger
      - prometheus
    networks:
      - quorvexa-net

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - "alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:3001"]
    metrics_path: /metrics

  - job_name: user-service
    static_configs:
      - targets: ["user-service:3002"]
    metrics_path: /metrics

  - job_name: workflow-service
    static_configs:
      - targets: ["workflow-service:3003"]
    metrics_path: /metrics

  - job_name: ai-agent-service
    static_configs:
      - targets: ["ai-agent-service:3005"]
    metrics_path: /metrics

  - job_name: gateway
    static_configs:
      - targets: ["gateway:4000"]
    metrics_path: /metrics

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:3004"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

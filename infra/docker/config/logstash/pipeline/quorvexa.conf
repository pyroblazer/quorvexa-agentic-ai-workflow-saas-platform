input {
  beats {
    port => 5044
  }

  # Also accept logs via HTTP for services that push directly
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse JSON logs from pino/structlog
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }

  # Normalize log level field names
  if [level] {
    mutate {
      rename => { "level" => "log_level" }
    }
  }

  # Add environment tag
  mutate {
    add_field => {
      "environment" => "${NODE_ENV:development}"
      "platform" => "quorvexa"
    }
  }

  # Drop noisy health check logs
  if [path] == "/api/v1/health/live" or [path] == "/api/v1/health/ready" {
    drop {}
  }

  date {
    match => ["time", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "quorvexa-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
}

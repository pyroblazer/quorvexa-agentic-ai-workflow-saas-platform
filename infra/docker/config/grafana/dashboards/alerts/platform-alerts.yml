groups:
  - name: quorvexa-service-health
    rules:
      - alert: ServiceDown
        expr: up{job=~"auth-service|workflow-service|ai-agent-service|gateway|notification-service|user-service"} == 0
        for: 1m
        labels:
          severity: critical
          iso27001: "A.8.16"
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (service)
          / sum(rate(http_requests_total[5m])) by (service) > 0.05
        for: 3m
        labels:
          severity: critical
          iso27001: "A.8.16"
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate exceeds 5% on {{ $labels.service }} for 3 minutes."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (service, le)) > 2
        for: 5m
        labels:
          severity: warning
          iso9001: "QM_9.1"
        annotations:
          summary: "High P95 latency on {{ $labels.service }}"
          description: "P95 latency exceeds 2 seconds on {{ $labels.service }} for 5 minutes."

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (service, le)) > 5
        for: 3m
        labels:
          severity: critical
          iso9001: "QM_9.1"
        annotations:
          summary: "Critical P99 latency on {{ $labels.service }}"
          description: "P99 latency exceeds 5 seconds on {{ $labels.service }} for 3 minutes."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / (1024 * 1024 * 1024) > 1.5
        for: 5m
        labels:
          severity: warning
          iso27001: "A.8.6"
        annotations:
          summary: "High memory usage on {{ $labels.service }}"
          description: "Memory usage exceeds 1.5GB on {{ $labels.service }}."

      - alert: MemoryLeakSuspected
        expr: |
          deriv(process_resident_memory_bytes[30m]) > 0
          and process_resident_memory_bytes / (1024 * 1024 * 1024) > 1
        for: 15m
        labels:
          severity: critical
          iso27001: "A.8.6"
        annotations:
          summary: "Memory leak suspected on {{ $labels.service }}"
          description: "Memory continuously increasing on {{ $labels.service }} for 30 minutes."

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          iso27001: "A.8.6"
        annotations:
          summary: "High CPU usage on {{ $labels.service }}"
          description: "CPU usage exceeds 80% on {{ $labels.service }} for 5 minutes."

      - alert: EventLoopLag
        expr: nodejs_eventloop_lag_seconds * 1000 > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Event loop lag on {{ $labels.service }}"
          description: "Node.js event loop lag exceeds 100ms on {{ $labels.service }}."

      - alert: DatabaseConnectionPoolExhausted
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 3m
        labels:
          severity: critical
          iso27001: "A.8.6"
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "PostgreSQL connections exceed 80% of max."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          iso27001: "A.8.6"
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage exceeds 85% of max."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis instance is unreachable."

      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          iso27001: "A.8.14"
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance is unreachable."

      - alert: AIAgentHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(ai_request_duration_seconds_bucket[5m])) by (le)) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI Agent P95 latency is high"
          description: "AI agent requests P95 exceeds 30 seconds."

      - alert: AIAgentErrorRate
        expr: |
          sum(rate(ai_requests_total{status="error"}[5m]))
          / sum(rate(ai_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI Agent error rate is high"
          description: "AI agent error rate exceeds 10%."

      - alert: HighFailedLogins
        expr: |
          sum(rate(http_requests_total{route=~".*auth.*login.*",status_code="401"}[5m])) > 1
        for: 3m
        labels:
          severity: critical
          iso27001: "A.8.5"
        annotations:
          summary: "High rate of failed login attempts"
          description: "Failed login rate exceeds threshold - possible brute force attack."

      - alert: CacheHitRateLow
        expr: |
          sum(rate(cache_hits_total[5m]))
          / (sum(rate(cache_hits_total[5m])) + sum(rate(cache_misses_total[5m]))) < 0.5
        for: 10m
        labels:
          severity: warning
          iso9001: "QM_9.1"
        annotations:
          summary: "Cache hit rate below 50%"
          description: "Cache hit rate is below 50% - review cache strategy."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
        for: 5m
        labels:
          severity: critical
          iso27001: "A.8.6"
        annotations:
          summary: "Disk space low on {{ $labels.mountpoint }}"
          description: "Available disk space below 15% on {{ $labels.mountpoint }}."

      - alert: TooManyRestarts
        expr: increase(process_start_time_seconds[1h]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} restarting too frequently"
          description: "Service has restarted more than 3 times in the last hour."

      - alert: GCPressure
        expr: rate(nodejs_gc_pause_seconds_sum[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High GC pressure on {{ $labels.service }}"
          description: "Garbage collection is consuming significant CPU on {{ $labels.service }}."

      - alert: NotificationDeliveryFailures
        expr: |
          sum(rate(http_requests_total{route=~".*notifications.*",status_code="500"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High notification delivery failure rate"
          description: "Notification delivery failures exceed threshold."
